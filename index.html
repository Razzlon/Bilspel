<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#72c8ff">
<title>Turbo & Vänner – Racing</title>
<style>
  :root { --ui: rgba(12,25,45,.82); --yellow:#ffe45c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#72c8ff; font-family:system-ui,-apple-system,Segoe UI,sans-serif; touch-action:none; }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; color:white; text-shadow:0 2px 3px #173047; }
  .pill { background:var(--ui); border:2px solid rgba(255,255,255,.65); border-radius:16px; padding:8px 13px; font-weight:800; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #brand { position:absolute; top:calc(env(safe-area-inset-top) + 12px); left:12px; font-size:clamp(13px,3.7vw,19px); }
  #position { position:absolute; top:calc(env(safe-area-inset-top) + 12px); right:12px; font-size:clamp(15px,4vw,22px); color:var(--yellow); }
  #message { position:absolute; top:24%; width:100%; text-align:center; padding:0 20px; font-size:clamp(25px,7vw,42px); font-weight:1000; line-height:1.1; }
  #submessage { display:block; font-size:clamp(14px,4vw,18px); margin-top:10px; font-weight:700; }
  #controls { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 18px); display:flex; justify-content:space-between; align-items:end; padding:0 18px; gap:14px; }
  .control { pointer-events:auto; border:3px solid white; border-radius:22px; background:rgba(15,38,64,.76); color:white; font-size:clamp(25px,7vw,38px); font-weight:900; min-width:74px; min-height:74px; box-shadow:0 5px 0 rgba(0,0,0,.25); }
  .control:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  #go { background:#ffb629; color:#382000; min-width:104px; font-size:17px; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(#4dbbff55,#17304788); }
  .panel { max-width:430px; width:100%; background:rgba(255,255,255,.96); color:#173047; border:4px solid white; border-radius:28px; padding:24px 20px; text-align:center; box-shadow:0 12px 35px #1238; }
  .panel h1 { margin:0 0 8px; font-size:clamp(27px,8vw,39px); line-height:1; }
  .panel p { line-height:1.4; margin:10px 0 18px; }
  #startBtn,#againBtn { border:0; border-radius:18px; background:#ffb629; color:#382000; font-size:21px; font-weight:1000; padding:15px 24px; width:100%; box-shadow:0 5px 0 #c77c12; }
  #againBtn { display:none; }
  .tiny { font-size:12px; opacity:.72; margin-top:14px; }
  @media (min-width:700px) { #controls { max-width:700px; margin:auto; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="brand" class="pill">🏁 TURBO & VÄNNER</div>
  <div id="position" class="pill">🥇 1:A PLATS</div>
  <div id="message"></div>
</div>
<div id="controls" aria-label="Spelkontroller">
  <button class="control" id="left" aria-label="Sväng vänster">◀</button>
  <button class="control" id="go" aria-label="Kör">GASA! 🚗</button>
  <button class="control" id="right" aria-label="Sväng höger">▶</button>
</div>
<div id="start">
  <div class="panel">
    <div style="font-size:54px;margin-bottom:8px">🏎️💨</div>
    <h1>Turbo & Vänner</h1>
    <p>Ett färgglatt raceräventyr! Sväng mellan körfälten, susa förbi kompisbilarna och kör över mållinjen.</p>
    <p><b>Tips:</b> Du är hjälten på banan – kompisbilarna hjälper dig att vinna!</p>
    <button id="startBtn">STARTA RACET!</button>
    <div class="tiny">Första testversionen • egna tecknade bilar</div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root = document.getElementById('game');
const startScreen = document.getElementById('start');
const startBtn = document.getElementById('startBtn');
const againBtn = document.getElementById('againBtn');
const message = document.getElementById('message');
const leftBtn = document.getElementById('left');
const rightBtn = document.getElementById('right');
const goBtn = document.getElementById('go');

let scene, camera, renderer, player, rivals=[], roadMarks=[], scenery=[];
let running=false, finished=false, lane=1, elapsed=0, lastTime=0, speed=0;
const laneX=[-2.35,0,2.35];
const mats={};

function mat(color, roughness=.8) {
  const key=color+'_'+roughness;
  if(!mats[key]) mats[key]=new THREE.MeshStandardMaterial({color, roughness});
  return mats[key];
}
function box(parent, w,h,d, color, x,y,z, material=null) {
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material || mat(color));
  mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}
function makeCar(color, accent, isPlayer=false) {
  const car=new THREE.Group();
  box(car,1.25,.48,2.05,color,0,.48,0);
  box(car,.94,.42,.88,accent,0,.83,-.13);
  box(car,.76,.29,.12,'#b8edff',0,.87,.34);
  box(car,1.28,.13,.34,color,0,.75,-.86);
  // friendly eyes on windshield
  const eyeWhite=mat('#ffffff'), pupil=mat('#173047');
  for(const x of [-.22,.22]) {
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.105,12,10),eyeWhite);
    eye.position.set(x,.91,.405); car.add(eye);
    const p=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),pupil);
    p.position.set(x+.018,.9,.49); car.add(p);
  }
  const wheelMat=mat('#20252d');
  for(const x of [-.67,.67]) for(const z of [-.62,.62]) {
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,16),wheelMat);
    wheel.rotation.z=Math.PI/2; wheel.position.set(x,.28,z); wheel.castShadow=true; car.add(wheel);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.17,12),mat('#d8e7f4'));
    hub.rotation.z=Math.PI/2; hub.position.set(x*1.01,.28,z); car.add(hub);
  }
  car.userData.isPlayer=isPlayer;
  return car;
}
function makeTree(x,z,scale=1) {
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.8,8),mat('#80502d'));
  trunk.position.y=.4; g.add(trunk);
  const top=new THREE.Mesh(new THREE.ConeGeometry(.65,1.5,8),mat(['#269447','#35a853','#17834b'][Math.floor(Math.random()*3)]));
  top.position.y=1.35; g.add(top);
  g.position.set(x,0,z); g.scale.setScalar(scale); scene.add(g); scenery.push(g);
}
function init() {
  scene=new THREE.Scene();
  scene.background=new THREE.Color('#83d5ff');
  scene.fog=new THREE.Fog('#83d5ff',28,105);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
  camera.position.set(0,5.3,9.4);
  camera.lookAt(0,1,-7);
  renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=false;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  root.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight('#ffffff','#6a9c5a',2.0));
  const sun=new THREE.DirectionalLight('#ffffff',2.2);
  sun.position.set(-5,10,7); scene.add(sun);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,220),mat('#66bd62'));
  ground.rotation.x=-Math.PI/2; ground.position.set(0,-.08,-45); scene.add(ground);

  const road=new THREE.Mesh(new THREE.PlaneGeometry(8.2,220),mat('#4a5260'));
  road.rotation.x=-Math.PI/2; road.position.set(0,0,-45); scene.add(road);
  // road edge stripes
  for(const x of [-4.05,4.05]) {
    const edge=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,220),mat('#fff2c7'));
    edge.position.set(x,.025,-45); scene.add(edge);
  }
  // dashed lane markings
  for(let i=0;i<24;i++) {
    for(const x of [-1.18,1.18]) {
      const mark=new THREE.Mesh(new THREE.BoxGeometry(.075,.025,2.1),mat('#fff6c9'));
      mark.position.set(x,.03,-i*8); scene.add(mark); roadMarks.push(mark);
    }
  }
  for(let i=0;i<34;i++) {
    const z=-i*6-3;
    makeTree(-6.1-(Math.random()*2),z,.75+Math.random()*.55);
    makeTree(6.1+(Math.random()*2),z,.75+Math.random()*.55);
  }
  // distant hills
  for(let i=0;i<9;i++) {
    const hill=new THREE.Mesh(new THREE.SphereGeometry(7+Math.random()*5,12,8),mat(['#8bd17c','#6fc56c','#a2dc83'][i%3]));
    hill.scale.y=.38; hill.position.set(-35+i*9,-1.5,-48-Math.random()*15); scene.add(hill);
  }
  player=makeCar('#f04438','#b9edff',true);
  player.position.set(0,0,3.0); scene.add(player);
  const colors=[['#2185e8','#b9edff'],['#ffb629','#fff0a6'],['#8e62d9','#e7d5ff'],['#21b7a5','#c9fff4']];
  for(let i=0;i<4;i++) {
    const c=makeCar(colors[i][0],colors[i][1]);
    c.position.set(laneX[i%3],0,-10-i*12);
    c.userData.baseZ=c.position.z; c.userData.phase=i*1.7;
    scene.add(c); rivals.push(c);
  }
  onResize();
}
function onResize() {
  if(!renderer) return;
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
function moveLane(dir) {
  if(!running || finished) return;
  lane=Math.max(0,Math.min(2,lane+dir));
}
leftBtn.addEventListener('pointerdown',e=>{e.preventDefault();moveLane(-1)});
rightBtn.addEventListener('pointerdown',e=>{e.preventDefault();moveLane(1)});
goBtn.addEventListener('pointerdown',e=>{e.preventDefault();speed=1});
goBtn.addEventListener('pointerup',()=>speed=0);
goBtn.addEventListener('pointercancel',()=>speed=0);
startBtn.addEventListener('click',startRace);
window.addEventListener('resize',onResize);
function startRace() {
  elapsed=0; lane=1; speed=0; finished=false; running=true;
  player.position.set(0,0,3);
  rivals.forEach((c,i)=>{c.position.set(laneX[(i+1)%3],0,-12-i*12);c.userData.phase=i*1.7});
  startScreen.style.display='none';
  message.innerHTML='KÖR, KÖR, KÖR!<span id="submessage">Du klarar det!</span>';
  setTimeout(()=>{if(running&&!finished) message.textContent=''},1900);
}
function finishRace() {
  finished=true; running=false;
  message.innerHTML='🏆 DU VANN! 🏆<span id="submessage">Fantastiskt kört! Du är banans mästare!</span>';
  startScreen.style.display='flex';
  startScreen.querySelector('h1').textContent='DU VANN!';
  startScreen.querySelector('.panel p').textContent='Vilket superrace! Alla kompisbilar jublar åt dig.';
  startBtn.textContent='KÖR IGEN!';
}
function animate(t) {
  requestAnimationFrame(animate);
  const dt=Math.min((t-lastTime)/1000||0,.05); lastTime=t;
  if(running && !finished) {
    elapsed+=dt;
    const targetX=laneX[lane];
    player.position.x += (targetX-player.position.x)*Math.min(1,dt*7);
    player.rotation.z=(targetX-player.position.x)*-.055;
    // road and scenery flow toward the player
    const flow=(speed?27:19)*dt;
    roadMarks.forEach(m=>{m.position.z+=flow;if(m.position.z>7)m.position.z-=192});
    scenery.forEach(s=>{s.position.z+=flow;if(s.position.z>10)s.position.z-=204});
    rivals.forEach((c,i)=>{
      c.position.z+=flow*(.58+0.04*Math.sin(elapsed+c.userData.phase));
      c.position.x=laneX[(i+Math.floor(elapsed/8))%3]+Math.sin(elapsed*.65+c.userData.phase)*.16;
      if(c.position.z>8) c.position.z=-35-i*8;
    });
    // The child always finishes first; race is deliberately forgiving.
    if(elapsed>32) finishRace();
  }
  // gentle chase camera
  camera.position.x += (player.position.x*.25-camera.position.x)*.035;
  camera.lookAt(player.position.x*.18,1,-7);
  if(renderer) renderer.render(scene,camera);
}
init();
requestAnimationFrame(animate);
</script>
</body>
</html>
